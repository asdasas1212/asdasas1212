<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">hkx — See. Think. Move. An automatically playing robotics showcase.</title>
  <desc id="description">A gradient headline and typing terminal above a looping indoor navigation demonstration. Perceive furniture, ground a cup as the goal, then draw a route and move the robot around obstacles. This is a preset illustrative replay, not live inference.</desc>
  <defs>
    <linearGradient id="headline"><stop class="tint-a" stop-color="#3df5a7"/><stop class="tint-b" offset=".5" stop-color="#34d1ff"/><stop class="tint-c" offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="green"><stop stop-color="#3df5a7" stop-opacity=".18"/><stop offset="1" stop-color="#3df5a7" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#34d1ff" stop-opacity=".13"/><stop offset="1" stop-color="#34d1ff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r=".8" fill="#34574d" opacity=".55"/></pattern>
    <pattern id="room-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#253c39" stroke-width=".5" opacity=".5"/></pattern>
    <clipPath id="round"><rect width="1200" height="760" rx="22"/></clipPath>
    <clipPath id="type-clip"><rect class="type-clip" x="395" y="207" width="410" height="29"/></clipPath>
    <clipPath id="room-clip"><rect x="72" y="356" width="523" height="300" rx="10"/></clipPath>
  </defs>
  <style>
    text{font-family:"Trebuchet MS",Arial,sans-serif}
    .mono{font-family:Menlo,Consolas,monospace}
    .tint-a{animation:tint-a 12s linear infinite}.tint-b{animation:tint-b 12s linear infinite}.tint-c{animation:tint-c 12s linear infinite}
    .aurora{animation:drift 16s ease-in-out infinite}
    .decor{animation:decor 8s ease-in-out infinite}.decor.second{animation-delay:-4s}
    .type-clip{animation:type 9s steps(38,end) infinite}
    .cursor{animation:cursor 9s steps(38,end) infinite}.blink{animation:blink 1s steps(1,end) infinite}
    .stage1{animation:stage1 18s linear infinite}.stage2{animation:stage2 18s linear infinite;opacity:0}.stage3{animation:stage3 18s linear infinite;opacity:0}
    .detections{animation:detected 18s linear infinite;opacity:.8}
    .grounded{animation:grounded 18s linear infinite;opacity:0}
    .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    .route{stroke-dasharray:735;stroke-dashoffset:735;animation:route 18s linear infinite;opacity:0}
    .robot{animation:robot 18s linear infinite}
    .scan{animation:scan 18s linear infinite;opacity:0}
    .playhead{transform:scaleX(0);transform-origin:52px 0;animation:progress 18s linear infinite}
    @keyframes tint-a{0%,100%{stop-color:#3df5a7}33%{stop-color:#34d1ff}66%{stop-color:#a78bfa}}
    @keyframes tint-b{0%,100%{stop-color:#34d1ff}33%{stop-color:#a78bfa}66%{stop-color:#3df5a7}}
    @keyframes tint-c{0%,100%{stop-color:#a78bfa}33%{stop-color:#3df5a7}66%{stop-color:#34d1ff}}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,12px)}}
    @keyframes decor{0%,100%{opacity:.1}50%{opacity:.7}}
    @keyframes type{0%,9%{width:410px}18%{width:0}65%,100%{width:410px}}
    @keyframes cursor{0%,9%{transform:translateX(351px)}18%{transform:translateX(0)}65%,100%{transform:translateX(351px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes stage1{0%,31%{opacity:1}33%,98%{opacity:0}100%{opacity:1}}
    @keyframes stage2{0%,32%{opacity:0}34%,64%{opacity:1}66%,100%{opacity:0}}
    @keyframes stage3{0%,65%{opacity:0}67%,98%{opacity:1}100%{opacity:0}}
    @keyframes detected{0%,100%{opacity:.8}8%,28%{opacity:.8}34%,96%{opacity:.25}}
    @keyframes grounded{0%,31%,100%{opacity:0}36%,96%{opacity:1}}
    @keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.7);opacity:0}}
    @keyframes route{0%,64%,100%{opacity:0;stroke-dashoffset:735}67%{opacity:1;stroke-dashoffset:735}82%,97%{opacity:1;stroke-dashoffset:0}}
    @keyframes robot{0%,69%,100%{transform:translate(0,0)}74%{transform:translate(76px,0)}79%{transform:translate(76px,-54px)}86%{transform:translate(340px,-54px)}93%,98%{transform:translate(340px,-214px)}}
    @keyframes scan{0%{opacity:0;transform:translateY(0)}2%{opacity:.8}28%{opacity:.8;transform:translateY(280px)}31%,100%{opacity:0;transform:translateY(280px)}}
    @keyframes progress{0%{transform:scaleX(0)}99.99%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.stage1,.stage2,.scan{opacity:0}.stage3,.grounded{opacity:1}.route{opacity:1;stroke-dashoffset:0}.robot{transform:translate(340px,-214px)}.cursor{transform:translateX(351px)}.playhead{transform:scaleX(1)}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="760" fill="#050a0e"/>
    <g class="aurora"><ellipse cx="90" cy="50" rx="520" ry="430" fill="url(#green)"/><ellipse cx="1170" cy="230" rx="500" ry="430" fill="url(#blue)"/></g>
    <rect width="1200" height="760" fill="url(#dots)"/>
    <g class="decor" fill="none" stroke="#3df5a7"><path d="M67 95V77h18m60 0h18v18m0 48v18h-18m-60 0H67v-18" stroke-width="2"/><text x="68" y="66" fill="#3df5a7" stroke="none" font-size="11" class="mono">perception</text></g>
    <g class="decor second" fill="none" stroke="#a78bfa"><path d="M1040 104V86h18m60 0h18v18m0 48v18h-18m-60 0h-18v-18" stroke-width="2"/><text x="1041" y="75" fill="#a78bfa" stroke="none" font-size="11" class="mono">grounding</text></g>
    <rect x="460" y="30" width="280" height="34" rx="17" fill="#0d1a1e" stroke="#28403f"/>
    <circle cx="479" cy="47" r="4" fill="#3df5a7"/>
    <text x="497" y="53" fill="#d9ece5" font-size="15" font-weight="600">hkx  /  @asdasas1212</text>
    <text x="600" y="141" text-anchor="middle" fill="url(#headline)" font-size="86" font-weight="700" letter-spacing="-3">See. Think. Move.</text>
    <text x="600" y="181" text-anchor="middle" fill="#b4cdc5" font-size="20">Robotics  /  Vision-Language Models  /  Navigation</text>
    <rect x="353" y="199" width="494" height="49" rx="10" fill="#071015" stroke="#253e3e"/>
    <text class="mono" x="374" y="230" fill="#3df5a7" font-size="15">&gt;</text>
    <text class="mono" x="396" y="230" fill="#d4e8e1" font-size="15" clip-path="url(#type-clip)">robot.navigate('understand the world')</text>
    <g class="cursor"><rect class="blink" x="396" y="216" width="7" height="15" fill="#3df5a7"/></g>
    <rect x="50" y="277" width="1100" height="420" rx="16" fill="#0a1419" stroke="#243c3d"/>
    <path d="M50 336H1150M621 336V673" stroke="#203334"/>
    <g font-size="14">
      <g fill="#8ba79a"><text x="94" y="313">01 / PERCEIVE</text><text x="285" y="313">02 / UNDERSTAND</text><text x="521" y="313">03 / PLAN + ACT</text></g>
      <g class="stage1"><rect x="69" y="289" width="175" height="36" rx="18" fill="#123328"/><circle cx="85" cy="308" r="3" fill="#3df5a7"/><text x="94" y="313" fill="#d7efe4">01 / PERCEIVE</text></g>
      <g class="stage2"><rect x="260" y="289" width="218" height="36" rx="18" fill="#103039"/><circle cx="276" cy="308" r="3" fill="#34d1ff"/><text x="285" y="313" fill="#d7efe4">02 / UNDERSTAND</text></g>
      <g class="stage3"><rect x="496" y="289" width="204" height="36" rx="18" fill="#26233f"/><circle cx="512" cy="308" r="3" fill="#a78bfa"/><text x="521" y="313" fill="#d7efe4">03 / PLAN + ACT</text></g>
    </g>
    <circle cx="971" cy="308" r="3" fill="#3df5a7"/>
    <text x="984" y="313" fill="#91ac9e" font-size="12" class="mono">AUTO REPLAY</text>
    <rect x="72" y="356" width="523" height="300" rx="10" fill="#071014"/>
    <rect x="72" y="356" width="523" height="300" rx="10" fill="url(#room-grid)"/>
    <path d="M108 605V380H566V632H175M108 605v27h12" fill="none" stroke="#36524b" stroke-width="2"/>
    <path d="M120 632a55 55 0 0 0 55-55" fill="none" stroke="#36524b" stroke-dasharray="3 4"/>
    <g fill="#152c2b" stroke="#36514c" stroke-width="1.5">
      <rect x="140" y="411" width="137" height="69" rx="10"/><rect x="133" y="418" width="16" height="61" rx="5"/><rect x="269" y="418" width="16" height="61" rx="5"/>
      <rect x="317" y="437" width="85" height="99" rx="12"/>
      <rect x="420" y="493" width="56" height="52" rx="8"/>
      <rect x="475" y="395" width="66" height="50" rx="7"/>
      <circle cx="166" cy="552" r="22"/>
    </g>
    <path d="M166 566v-29m0 15-11-12m11 7 10-11m-10 20 12-8" stroke="#567664" fill="none"/>
    <g class="mono" fill="#93aca0" font-size="10" text-anchor="middle"><text x="207" y="449">sofa</text><text x="359" y="488">table</text><text x="448" y="523">chair</text><text x="166" y="588">plant</text></g>
    <circle cx="502" cy="414" r="8" fill="none" stroke="#c2dad1" stroke-width="2"/><path d="M510 410h4v7h-4" fill="none" stroke="#c2dad1" stroke-width="2"/>
    <g class="detections" fill="none" stroke-width="1.5">
      <rect x="130" y="400" width="158" height="86" rx="5" stroke="#3df5a7"/><rect x="306" y="425" width="108" height="122" rx="5" stroke="#34d1ff"/><rect x="489" y="399" width="29" height="30" rx="3" stroke="#a78bfa"/>
      <g font-size="10" class="mono" stroke="none"><rect x="130" y="387" width="39" height="14" fill="#3df5a7"/><text x="135" y="397" fill="#04110c">sofa</text><rect x="306" y="412" width="46" height="14" fill="#34d1ff"/><text x="310" y="422" fill="#04110c">table</text><rect x="489" y="386" width="32" height="14" fill="#a78bfa"/><text x="493" y="396" fill="#04110c">cup</text></g>
    </g>
    <g clip-path="url(#room-clip)"><path class="scan" d="M90 370H576" stroke="#3df5a7" opacity=".7"/><path class="scan" d="M90 364H576" stroke="#3df5a7" stroke-width="8" opacity=".07"/></g>
    <g class="grounded"><circle cx="502" cy="414" r="20" fill="#3df5a710" stroke="#3df5a7"/><circle class="ring" cx="502" cy="414" r="21" fill="none" stroke="#3df5a7"/><text x="502" y="464" text-anchor="middle" fill="#3df5a7" font-size="10" class="mono">target grounded</text></g>
    <path class="route" d="M162 628H238V574H502V414" fill="none" stroke="#3df5a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="robot"><circle cx="162" cy="628" r="14" fill="#103629" stroke="#3df5a7" stroke-width="2"/><path d="m162 619 5 13-5-3-5 3Z" fill="#3df5a7"/><circle cx="162" cy="628" r="19" fill="none" stroke="#3df5a7" opacity=".18"/></g>
    <circle cx="648" cy="363" r="3" fill="#b75a68"/><circle cx="659" cy="363" r="3" fill="#bfa663"/><circle cx="670" cy="363" r="3" fill="#67aa83"/>
    <text x="688" y="367" fill="#9eb6a9" font-size="11" class="mono">perception_to_action()</text>
    <g class="mono" font-size="13">
      <g class="stage1">
        <text x="648" y="412" fill="#809f90" font-size="10">PROMPT</text><text x="648" y="440" fill="#dce9e2">Observe the room.</text>
        <text x="648" y="483" fill="#809f90" font-size="10">PERCEPTION</text>
        <text x="648" y="513" fill="#3df5a7">&lt;objects&gt;</text><text x="668" y="540" fill="#bfd2c8">sofa, table, chair, cup</text><text x="648" y="567" fill="#3df5a7">&lt;/objects&gt;</text>
        <text x="648" y="623" fill="#91ae9e">Scene parsed. Objects localized.</text>
      </g>
      <g class="stage2">
        <text x="648" y="412" fill="#809f90" font-size="10">PROMPT</text><text x="648" y="440" fill="#dce9e2">Find the cup on the table.</text>
        <text x="648" y="483" fill="#809f90" font-size="10">GROUNDING</text>
        <text x="648" y="513" fill="#34d1ff">&lt;goal&gt;cup&lt;/goal&gt;</text><text x="648" y="540" fill="#bfd2c8">&lt;location&gt;upper right&lt;/location&gt;</text><text x="648" y="567" fill="#a78bfa">&lt;intent&gt;approach&lt;/intent&gt;</text>
        <text x="648" y="623" fill="#91ae9e">Language connected to space.</text>
      </g>
      <g class="stage3">
        <text x="648" y="412" fill="#809f90" font-size="10">PROMPT</text><text x="648" y="440" fill="#dce9e2">Navigate to the cup.</text>
        <text x="648" y="483" fill="#809f90" font-size="10">PLANNING + ACTION</text>
        <text x="648" y="513" fill="#3df5a7">&lt;goal&gt;cup&lt;/goal&gt;</text><text x="648" y="540" fill="#a78bfa">&lt;plan&gt;avoid furniture&lt;/plan&gt;</text><text x="648" y="567" fill="#34d1ff">&lt;action&gt;navigate_to_goal()&lt;/action&gt;</text>
        <text x="648" y="623" fill="#91ae9e">Perception becomes action.</text>
      </g>
    </g>
    <rect x="52" y="693" width="1096" height="2" fill="#162b27"/>
    <rect class="playhead" x="52" y="693" width="1096" height="2" fill="url(#headline)"/>
    <g class="mono" fill="#7f9f91" font-size="11"><text x="73" y="679">indoor navigation / illustrative replay</text><text x="1125" y="679" text-anchor="end">18s loop</text></g>
    <text x="600" y="730" text-anchor="middle" fill="#8aa99a" font-size="12" class="mono">perceive  &gt;  understand  &gt;  plan  &gt;  act</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="759" rx="22" fill="none" stroke="#213d3d"/>
</svg>
